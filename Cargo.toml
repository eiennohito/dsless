[package]
name = "dsless"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
arrow = { version = "59", features = ["prettyprint", "json"] }
parquet = { version = "59", features = ["arrow", "zstd"] }
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
lru = "0.18"
ryu = "1.0.23"
rustc-hash = "2.1.2"
smallvec = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
